services:
  app:
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: workbuddy-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-workbuddy_auth}
      MYSQL_USER: ${DB_USERNAME:-workbuddy_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
    driver: local