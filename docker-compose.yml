services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workbuddy-auth
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped